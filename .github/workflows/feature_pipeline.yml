# SCRIPT 1 - hourly data collection + feature engineering
name: Feature Pipeline

on:
  schedule:
    - cron: "5 * * * *"      # every hour at minute 5 (UTC). GitHub may delay scheduled runs.
  workflow_dispatch: {}

concurrency:
  group: feature-pipeline
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
      AQICN_TOKEN: ${{ secrets.AQICN_TOKEN }}
      HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
      HOPSWORKS_PROJECT: ${{ secrets.HOPSWORKS_PROJECT }}
      STORE_BACKEND: hopsworks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-pipeline.txt
      - run: pip install -r requirements-pipeline.txt
      - run: python -m scripts.run_feature_pipeline
